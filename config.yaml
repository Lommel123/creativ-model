base_model: unsloth/Qwen3-14B-unsloth-bnb-4bit   # bei Speicherproblemen: unsloth/Qwen3-8B-unsloth-bnb-4bit
max_seq_length: 2048

lora:
  r: 16
  alpha: 32
  dropout: 0.0

# Stufe 1: Denkprozess lernen
sft:
  epochs: 2                 # mehr unterschiedliche Daten statt Wiederholung
  lr: 1.0e-4
  batch_size: 1
  grad_accum: 8
  eval_steps: 25            # Prüfset-Loss alle 25 Schritte; bestes Checkpoint wird behalten

# Nachtlauf (00_komplett.ipynb): Kaggle bricht nach 12 h hart ab
run:
  time_budget_hours: 11.5   # danach wird sauber gestoppt und gespeichert
  sft_max_hours: 3.0        # Stufe 1 bekommt höchstens so viel davon

# Stufe 2: selbst erfinden (Reinforcement Learning) – Ziel: komplett in EINER ~11-h-Session
# Abwägung (T4 x2, 14B): Generierung ist ~75 % der Schrittzeit.
#  - num_generations bleibt 4: mit 2 vergleicht GRPO nur noch Paare -> sehr verrauschtes Lernsignal
#  - max_completion_length bleibt 512: Trainingsantworten haben Median 429 Tokens (Qwen3-Tokenizer),
#    384 würde 78 %, 448 noch 38 % mitten in "Beste Idee" abschneiden
#  - Tempo stattdessen über größeren Generierungs-Batch (16) + Längenstrafe, die wirklich greift
#  - kein vLLM: auf T4 mit 14B nicht belegt, extra Installation = Risiko für den ganzen Nachtlauf
#  - 8B nur als Fallback: bräuchte neues SFT (~2 h) und denkt schlechter
grpo:
  max_steps: 200            # bei ~2 min/Schritt ~7 h; im ungünstigen Fall stoppt das Zeitbudget bei ~170
  time_budget_hours: 10.5   # pro Session; lässt GPU-Kontingent für den Test (03) übrig
  save_steps: 20            # Checkpoint ca. alle 40–70 min
  lr: 5.0e-6
  num_generations: 4        # Ideen pro Frage, die gegeneinander verglichen werden
  batch_size: 4
  grad_accum: 2
  steps_per_generation: 4   # 16 Antworten in EINEM Generierungs-Batch statt 2x8; bei OOM autom. Rückfall auf 8
  max_prompt_length: 256    # (wird von neuerem TRL ignoriert – Prompts sind ohnehin kurz)
  max_completion_length: 512
  mask_truncated_completions: true   # abgeschnittene Antworten zählen nicht in den Loss
  length_target_words: 230  # ≈ 440 Tokens: Strafe ab hier (Trainingsdaten Median 226 Wörter)
  length_max_words: 265     # ≈ 505 Tokens: volle Strafe (-1) kurz vor dem 512-Token-Limit
  temperature: 0.9
  judge_model: unsloth/Qwen3-4B-unsloth-bnb-4bit   # läuft auf der 2. GPU, bewertet nur "funktioniert das?"
  embed_model: intfloat/multilingual-e5-small
  reward_weights:
    format: 0.5
    creative_valid: 1.0     # Originalität zählt nur, wenn die Idee auch funktioniert
    diversity: 0.3
    length: 0.2

eval:
  embed_model: intfloat/multilingual-e5-small
  judge_model: unsloth/Qwen3-4B-unsloth-bnb-4bit
  general_prompts: 25
  business_prompts: 20
  samples_per_prompt: 2
  temperature: 0.8

# Vergleich Basis · nur Stufe 1 · Stufe 1+2 (05_vergleich.ipynb) – Ziel 3–4 h auf T4 x2
compare:
  judge_model: unsloth/Meta-Llama-3.1-8B-Instruct-bnb-4bit   # andere Modellfamilie als Training (Qwen) und Trainings-Judge
  judge_fallback: unsloth/Qwen3-8B-unsloth-bnb-4bit          # falls Llama nicht lädt
  embed_model: intfloat/multilingual-e5-small
  prompts: {allgemein: 10, business: 15, business_evolution: 15}   # 40 Fragen, alle mit fairer Referenz
  samples: 4                 # pro Frage und Variante, in EINEM Generierungs-Batch
  max_new_tokens: 560        # Trainingsantworten: Median 429 Tokens
  temperature: 0.8
  gen_budget_hours: 2.6      # Zeitwächter: danach keine neue Frage mehr (alle 3 Varianten bleiben gleich lang)
  seed: 42
