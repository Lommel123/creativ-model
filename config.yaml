base_model: unsloth/Qwen3-14B-unsloth-bnb-4bit   # bei Speicherproblemen: unsloth/Qwen3-8B-unsloth-bnb-4bit
max_seq_length: 2048

lora:
  r: 16
  alpha: 32
  dropout: 0.0

# Stufe 1: Denkprozess lernen
sft:
  epochs: 2                 # mehr unterschiedliche Daten statt Wiederholung
  lr: 1.0e-4
  batch_size: 1
  grad_accum: 8
  eval_steps: 25            # Prüfset-Loss alle 25 Schritte; bestes Checkpoint wird behalten

# Nachtlauf (00_komplett.ipynb): Kaggle bricht nach 12 h hart ab
run:
  time_budget_hours: 11.5   # danach wird sauber gestoppt und gespeichert
  sft_max_hours: 3.0        # Stufe 1 bekommt höchstens so viel davon

# Stufe 2: selbst erfinden (Reinforcement Learning)
# Realistisch auf T4 x2 mit 14B: ~3 min/Schritt (Generierung dominiert).
# Plan: Lauf 1 (~180 Schritte) + Fortsetzung in Lauf 2 bis max_steps.
grpo:
  max_steps: 360            # Gesamtziel über beide Läufe (~0,8 Durchgänge durch 922 Fragen)
  time_budget_hours: 10.5   # pro Session; lässt GPU-Kontingent für den Test (03) übrig
  save_steps: 20            # Checkpoint ca. stündlich
  lr: 5.0e-6
  num_generations: 4        # Ideen pro Frage, die gegeneinander verglichen werden
  batch_size: 4
  grad_accum: 2
  steps_per_generation: 4   # 16 Antworten in EINEM Generierungs-Batch statt 2x8 (schneller auf T4); bei OOM autom. Rückfall auf 2
  max_prompt_length: 256    # (wird von neuerem TRL ignoriert – Prompts sind ohnehin kurz)
  max_completion_length: 512
  mask_truncated_completions: true   # abgeschnittene Antworten zählen nicht in den Loss
  length_target_words: 280  # Strafe ab hier (Trainingsdaten: Median 224, max 328 Wörter)
  length_max_words: 340     # volle Strafe (-1) ab hier
  temperature: 0.9
  judge_model: unsloth/Qwen3-4B-unsloth-bnb-4bit   # läuft auf der 2. GPU, bewertet nur "funktioniert das?"
  embed_model: intfloat/multilingual-e5-small
  reward_weights:
    format: 0.5
    creative_valid: 1.0     # Originalität zählt nur, wenn die Idee auch funktioniert
    diversity: 0.3
    length: 0.2

eval:
  embed_model: intfloat/multilingual-e5-small
  judge_model: unsloth/Qwen3-4B-unsloth-bnb-4bit
  general_prompts: 25
  business_prompts: 20
  samples_per_prompt: 2
  temperature: 0.8
